<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#63b3ed"/>
      <stop offset="60%" stop-color="#ebf8ff"/>
      <stop offset="100%" stop-color="#feebc8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  
  <!-- Sun -->
  <circle cx="700" cy="90" r="45" fill="#f6ad55" opacity="0.8"/>
  
  <!-- Lawn/Ground -->
  <rect x="0" y="360" width="800" height="140" fill="#48bb78"/>
  <path d="M 0 380 Q 400 350 800 380 L 800 500 L 0 500 Z" fill="#38a169"/>
  <path d="M 320 500 L 370 380 L 430 380 L 480 500 Z" fill="#e2e8f0"/>

  <!-- Main School Building (Double Storied) -->
  <rect x="120" y="180" width="560" height="200" fill="#edf2f7" stroke="#cbd5e0" stroke-width="3"/>
  <!-- Second Storey Roof & Parapet -->
  <rect x="110" y="170" width="580" height="15" fill="#c53030"/>
  <rect x="330" y="130" width="140" height="45" fill="#2b6cb0"/>
  <polygon points="320,130 400,85 480,130" fill="#9b2c2c"/>
  
  <!-- School Name Sign on Building -->
  <rect x="220" y="195" width="360" height="30" fill="#1a365d" rx="4"/>
  <text x="400" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    TELANGANA STATE MODEL SCHOOL, KAMALAPUR
  </text>
  
  <!-- Top Floor Windows & Arches -->
  <g fill="#bee3f8" stroke="#4a5568" stroke-width="2">
    <rect x="150" y="240" width="45" height="35" rx="3"/>
    <rect x="215" y="240" width="45" height="35" rx="3"/>
    <rect x="280" y="240" width="45" height="35" rx="3"/>
    <rect x="475" y="240" width="45" height="35" rx="3"/>
    <rect x="540" y="240" width="45" height="35" rx="3"/>
    <rect x="605" y="240" width="45" height="35" rx="3"/>
  </g>
  
  <!-- Balcony Railing Line -->
  <line x1="120" y1="290" x2="680" y2="290" stroke="#718096" stroke-width="4"/>

  <!-- Ground Floor Pillars & Windows -->
  <g fill="#bee3f8" stroke="#4a5568" stroke-width="2">
    <rect x="150" y="310" width="45" height="45" rx="3"/>
    <rect x="215" y="310" width="45" height="45" rx="3"/>
    <rect x="280" y="310" width="45" height="45" rx="3"/>
    <rect x="475" y="310" width="45" height="45" rx="3"/>
    <rect x="540" y="310" width="45" height="45" rx="3"/>
    <rect x="605" y="310" width="45" height="45" rx="3"/>
  </g>

  <!-- Central Entrance Arch -->
  <path d="M 360 380 L 360 260 Q 400 230 440 260 L 440 380 Z" fill="#2d3748"/>
  <circle cx="400" cy="155" r="16" fill="#ecc94b"/>

  <!-- Flagpole with Tricolor -->
  <line x1="400" y1="85" x2="400" y2="30" stroke="#a0aec0" stroke-width="4"/>
  <rect x="403" y="30" width="45" height="10" fill="#ff9933"/>
  <rect x="403" y="40" width="45" height="10" fill="#ffffff"/>
  <circle cx="425" cy="45" r="4" fill="#000080"/>
  <rect x="403" y="50" width="45" height="10" fill="#128807"/>

  <!-- Trees on lawn -->
  <g fill="#276749">
    <circle cx="80" cy="350" r="35"/>
    <rect x="75" y="350" width="10" height="40" fill="#744210"/>
    <circle cx="720" cy="350" r="35"/>
    <rect x="715" y="350" width="10" height="40" fill="#744210"/>
  </g>

  <!-- Title Banner -->
  <rect x="200" y="445" width="400" height="40" rx="8" fill="rgba(0,0,0,0.6)"/>
  <text x="400" y="470" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    TSMS KAMALAPUR • 5-ACRE SPACIOUS CAMPUS
  </text>
</svg>