<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#2a5298" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5"/>
      <stop offset="100%" stop-color="#e0ac83"/>
    </linearGradient>
  </defs>
  <rect width="400" height="450" rx="12" fill="url(#pGrad)"/>
  
  <!-- Background Aura -->
  <circle cx="200" cy="180" r="140" fill="rgba(255,255,255,0.06)"/>
  <circle cx="200" cy="180" r="105" fill="rgba(255,255,255,0.08)"/>

  <!-- Head & Hair -->
  <circle cx="200" cy="155" r="55" fill="url(#skinGrad)"/>
  <path d="M 148 145 C 145 110 170 95 200 95 C 230 95 255 110 252 145 C 240 108 220 105 200 105 C 180 105 160 108 148 145 Z" fill="#2d3748"/>
  
  <!-- Glasses -->
  <rect x="165" y="145" width="28" height="20" rx="4" fill="none" stroke="#4a5568" stroke-width="3"/>
  <rect x="207" y="145" width="28" height="20" rx="4" fill="none" stroke="#4a5568" stroke-width="3"/>
  <line x1="193" y1="154" x2="207" y2="154" stroke="#4a5568" stroke-width="3"/>

  <!-- Neck -->
  <rect x="188" y="200" width="24" height="25" fill="#e0ac83"/>

  <!-- Suit Body -->
  <path d="M 110 320 L 140 220 L 200 235 L 260 220 L 290 320 L 320 450 L 80 450 Z" fill="#1a202c"/>
  <!-- White Shirt Collars -->
  <polygon points="175,225 200,270 200,225" fill="#ffffff"/>
  <polygon points="225,225 200,270 200,225" fill="#ffffff"/>
  <!-- Red Tie -->
  <polygon points="195,235 205,235 208,310 200,325 192,310" fill="#e53e3e"/>
  
  <!-- Lapels -->
  <polygon points="140,220 185,290 170,360 125,280" fill="#2d3748"/>
  <polygon points="260,220 215,290 230,360 275,280" fill="#2d3748"/>

  <!-- Name Plaque -->
  <rect x="50" y="380" width="300" height="50" rx="8" fill="rgba(0,0,0,0.5)" stroke="#f6ad55" stroke-width="1.5"/>
  <text x="200" y="402" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    K. B. DHARMA PRAKASH
  </text>
  <text x="200" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f6ad55" text-anchor="middle">
    PRINCIPAL, TSMS KAMALAPUR
  </text>
</svg>