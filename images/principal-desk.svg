<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#edf2f7"/>
      <stop offset="100%" stop-color="#cbd5e0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#wall)"/>
  <rect x="0" y="300" width="600" height="100" fill="#a0aec0"/>
  
  <!-- Wall Certificate & Telangana Emblem -->
  <rect x="70" y="40" width="100" height="130" rx="4" fill="#ffffff" stroke="#4a5568" stroke-width="4"/>
  <rect x="80" y="50" width="80" height="110" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="90" y1="70" x2="150" y2="70" stroke="#718096" stroke-width="3"/>
  <line x1="90" y1="85" x2="140" y2="85" stroke="#a0aec0" stroke-width="2"/>
  <line x1="90" y1="98" x2="145" y2="98" stroke="#a0aec0" stroke-width="2"/>
  <circle cx="120" cy="130" r="14" fill="#e53e3e"/>

  <!-- Bookshelf -->
  <rect x="440" y="30" width="120" height="270" fill="#744210" stroke="#553c9a" stroke-width="2"/>
  <rect x="445" y="80" width="110" height="6" fill="#975a16"/>
  <rect x="445" y="145" width="110" height="6" fill="#975a16"/>
  <rect x="445" y="210" width="110" height="6" fill="#975a16"/>
  <!-- Books -->
  <rect x="455" y="40" width="16" height="40" fill="#3182ce"/>
  <rect x="473" y="45" width="14" height="35" fill="#38a169"/>
  <rect x="490" y="38" width="18" height="42" fill="#d69e2e"/>
  <rect x="510" y="42" width="22" height="38" fill="#e53e3e"/>
  <rect x="455" y="100" width="20" height="45" fill="#805ad5"/>
  <rect x="478" y="105" width="25" height="40" fill="#319795"/>

  <!-- Principal's Table -->
  <rect x="100" y="240" width="400" height="120" rx="6" fill="#502c11"/>
  <rect x="110" y="240" width="380" height="15" fill="#744210"/>
  <!-- Table Items: Laptop, Globe, Pen stand -->
  <rect x="230" y="215" width="70" height="40" rx="3" fill="#2d3748"/>
  <polygon points="215,255 315,255 305,245 225,245" fill="#718096"/>
  <!-- Pen stand -->
  <rect x="360" y="220" width="18" height="25" fill="#2b6cb0"/>
  <line x1="365" y1="210" x2="368" y2="225" stroke="#e53e3e" stroke-width="3"/>
  <line x1="372" y1="205" x2="370" y2="225" stroke="#3182ce" stroke-width="3"/>
  <!-- Table Nameplate -->
  <rect x="130" y="250" width="80" height="20" rx="2" fill="#d69e2e"/>
  <text x="170" y="264" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#000" text-anchor="middle">PRINCIPAL</text>
  
  <text x="300" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Office of the Principal • TSMS Kamalapur
  </text>
</svg>