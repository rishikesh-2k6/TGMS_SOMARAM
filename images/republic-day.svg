<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="skyR" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#90cdf4"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#skyR)"/>
  <rect x="0" y="300" width="600" height="100" fill="#38a169"/>

  <!-- Flagpost & Stages -->
  <rect x="220" y="270" width="160" height="30" fill="#e2e8f0" stroke="#cbd5e0" stroke-width="2"/>
  <rect x="250" y="250" width="100" height="20" fill="#cbd5e0"/>
  <line x1="300" y1="250" x2="300" y2="60" stroke="#718096" stroke-width="6"/>

  <!-- National Flag Waving -->
  <g>
    <path d="M 303 60 Q 360 50 400 65 Q 430 75 460 65 L 460 90 Q 430 100 400 90 Q 360 75 303 85 Z" fill="#ff9933"/>
    <path d="M 303 85 Q 360 75 400 90 Q 430 100 460 90 L 460 115 Q 430 125 400 115 Q 360 100 303 110 Z" fill="#ffffff"/>
    <circle cx="380" cy="100" r="10" fill="none" stroke="#000080" stroke-width="2"/>
    <path d="M 303 110 Q 360 100 400 115 Q 430 125 460 115 L 460 140 Q 430 150 400 140 Q 360 125 303 135 Z" fill="#128807"/>
  </g>

  <!-- Flower Petals shower -->
  <circle cx="310" cy="150" r="4" fill="#e53e3e"/>
  <circle cx="340" cy="165" r="5" fill="#f6ad55"/>
  <circle cx="290" cy="180" r="4" fill="#ecc94b"/>
  <circle cx="370" cy="190" r="5" fill="#e53e3e"/>
  <circle cx="325" cy="200" r="4" fill="#f6ad55"/>

  <!-- Students saluting silhouette -->
  <g fill="#1a202c">
    <circle cx="120" cy="260" r="12"/>
    <rect x="110" y="272" width="20" height="40"/>
    <line x1="125" y1="275" x2="135" y2="255" stroke="#1a202c" stroke-width="4"/>

    <circle cx="160" cy="260" r="12"/>
    <rect x="150" y="272" width="20" height="40"/>
    <line x1="165" y1="275" x2="175" y2="255" stroke="#1a202c" stroke-width="4"/>

    <circle cx="480" cy="260" r="12"/>
    <rect x="470" y="272" width="20" height="40"/>
    <line x1="475" y1="275" x2="465" y2="255" stroke="#1a202c" stroke-width="4"/>

    <circle cx="520" cy="260" r="12"/>
    <rect x="510" y="272" width="20" height="40"/>
    <line x1="515" y1="275" x2="505" y2="255" stroke="#1a202c" stroke-width="4"/>
  </g>

  <rect x="120" y="340" width="360" height="35" rx="6" fill="rgba(0,0,0,0.6)"/>
  <text x="300" y="363" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    REPUBLIC DAY & PATRIOTIC CELEBRATIONS
  </text>
</svg>