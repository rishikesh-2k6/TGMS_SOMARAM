<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sciBg" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171923"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sciBg)"/>
  
  <!-- Light Beam entering Prism -->
  <line x1="40" y1="180" x2="220" y2="200" stroke="#ffffff" stroke-width="5"/>
  <!-- Glass Triangular Prism -->
  <polygon points="260,110 320,240 200,240" fill="rgba(255,255,255,0.2)" stroke="#90cdf4" stroke-width="3"/>
  <!-- Dispersed Rainbow Spectrum -->
  <polygon points="295,190 560,90 560,110 295,195" fill="#e53e3e" opacity="0.85"/>
  <polygon points="295,195 560,110 560,130 295,200" fill="#ed8936" opacity="0.85"/>
  <polygon points="295,200 560,130 560,150 295,205" fill="#ecc94b" opacity="0.85"/>
  <polygon points="295,205 560,150 560,170 295,210" fill="#48bb78" opacity="0.85"/>
  <polygon points="295,210 560,170 560,190 295,215" fill="#4299e1" opacity="0.85"/>
  <polygon points="295,215 560,190 560,210 295,220" fill="#3182ce" opacity="0.85"/>
  <polygon points="295,220 560,210 560,230 295,225" fill="#805ad5" opacity="0.85"/>

  <!-- Sir C.V. Raman Portrait / Label Badge -->
  <circle cx="120" cy="90" r="35" fill="#2b6cb0" stroke="#ecc94b" stroke-width="2"/>
  <text x="120" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">SIR C.V.</text>
  <text x="120" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#ecc94b" text-anchor="middle">RAMAN</text>

  <rect x="120" y="335" width="360" height="45" rx="8" fill="rgba(0,0,0,0.7)" stroke="#4299e1" stroke-width="1.5"/>
  <text x="300" y="356" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    NATIONAL SCIENCE DAY (SIR C.V. RAMAN)
  </text>
  <text x="300" y="372" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e0" text-anchor="middle">
    Science Fair & Innovative Student Projects Exhibition
  </text>
</svg>