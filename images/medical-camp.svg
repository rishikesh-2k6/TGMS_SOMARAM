<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="medBg" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#ebf8ff"/>
      <stop offset="100%" stop-color="#bee3f8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#medBg)"/>

  <!-- Red Cross Emblem -->
  <circle cx="300" cy="150" r="75" fill="#ffffff" stroke="#e53e3e" stroke-width="4"/>
  <rect x="282" y="105" width="36" height="90" rx="4" fill="#e53e3e"/>
  <rect x="255" y="132" width="90" height="36" rx="4" fill="#e53e3e"/>

  <!-- Stethoscope Outline -->
  <path d="M 170 120 C 170 210 230 240 280 240 L 320 240 C 370 240 430 210 430 120" fill="none" stroke="#2b6cb0" stroke-width="6"/>
  <circle cx="170" cy="115" r="8" fill="#4a5568"/>
  <circle cx="430" cy="115" r="8" fill="#4a5568"/>
  <line x1="300" y1="240" x2="300" y2="280" stroke="#2b6cb0" stroke-width="6"/>
  <circle cx="300" cy="295" r="18" fill="#cbd5e0" stroke="#2b6cb0" stroke-width="5"/>

  <!-- Pulse Heartbeat ECG line -->
  <polyline points="50,310 180,310 200,270 220,340 240,290 260,310 340,310 360,270 380,340 400,290 420,310 550,310" fill="none" stroke="#e53e3e" stroke-width="4"/>

  <rect x="120" y="340" width="360" height="38" rx="6" fill="#1a365d"/>
  <text x="300" y="364" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    FREE MEDICAL & HEALTH CHECKUP CAMP
  </text>
</svg>