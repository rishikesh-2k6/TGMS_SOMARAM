  </defs>
  <rect width="600" height="400" fill="url(#alchBg)"/>
  
  <!-- Glowing Target Center -->
  <circle cx="300" cy="180" r="110" fill="none" stroke="rgba(245,158,11,0.2)" stroke-width="2"/>
  <circle cx="300" cy="180" r="80" fill="none" stroke="rgba(245,158,11,0.4)" stroke-width="2"/>
