  <polygon points="460,70 485,75 475,98" fill="#10b981"/>

  <!-- Data point nodes -->
  <circle cx="150" cy="290" r="7" fill="#60a5fa"/>
  <circle cx="240" cy="240" r="7" fill="#60a5fa"/>
  <circle cx="330" cy="190" r="7" fill="#60a5fa"/>
  <circle cx="420" cy="110" r="7" fill="#60a5fa"/>
  
